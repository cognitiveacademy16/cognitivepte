<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Gallery & Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .media-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        /* Hide default file input */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="FINAL.html" class="flex items-center text-rose-600 hover:text-rose-700 transition-colors text-sm font-medium">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back to Home
                    </a>
                </div>
                <div class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-rose-600 to-pink-500">
                    Media Hub
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Reduced, less prominent Upload Section -->
        <section class="mb-10">
            <form id="uploadForm" class="max-w-3xl mx-auto">
                <label for="mediaInput" class="cursor-pointer flex flex-row items-center justify-center w-full py-4 px-6 border border-slate-300 border-dashed rounded-lg bg-transparent hover:bg-slate-50 transition-colors opacity-70 hover:opacity-100">
                    <svg class="w-6 h-6 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <span class="text-sm text-slate-500 font-medium"><span class="text-rose-600">Click to upload</span> or drag and drop media (Max 300MB)</span>
                    <input id="mediaInput" type="file" multiple accept="image/*,video/*" />
                </label>
            </form>
        </section>

        <section>
            <div class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                <h2 class="text-xl font-bold text-slate-800">Gallery</h2>
                <span id="mediaCount" class="text-slate-500 text-sm font-medium">
                    4 Items
                </span>
            </div>

            <div id="mediaGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                
                <!-- Placeholder Image 1 -->
                <div class="media-card bg-slate-100 rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group h-48 md:h-56">
                    <video src="add2.mp4" controls class="w-full h-full object-contain"></video>
" class="w-full h-full object-contain">
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">
                        <span class="text-white opacity-0 group-hover:opacity-100 font-medium tracking-wide text-sm">View</span>
                    </div>
                </div>

                <!-- Placeholder Video 1 -->
                <div class="media-card bg-black rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group h-48 md:h-56">
                    <video src="add1.mp4" controls class="w-full h-full object-contain"></video>
                    <div class="absolute top-2 right-2 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm pointer-events-none">Video</div>
                </div>

                <!-- Placeholder Image 2 -->
                <div class="media-card bg-slate-100 rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group h-68 md:h-76">
                    <img src="poster1.png" alt="Placeholder 2" class="w-full h-full object-contain">
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">
                        <span class="text-white opacity-0 group-hover:opacity-100 font-medium tracking-wide text-sm">View</span>
                    </div>
                </div>
                
                <!-- Placeholder Image 3 -->
                <div class="media-card bg-slate-100 rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group h-68 md:h-76">
                    <img src="poster2.jpeg">
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">
                        <span class="text-white opacity-0 group-hover:opacity-100 font-medium tracking-wide text-sm">View</span>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mediaInput = document.getElementById('mediaInput');
            const mediaGrid = document.getElementById('mediaGrid');
            const mediaCountSpan = document.getElementById('mediaCount');
            
            let totalItems = 4; // Starting count

            mediaInput.addEventListener('change', function(event) {
                const files = event.target.files;
                
                if (files.length === 0) return;

                // Loop through all selected files
                Array.from(files).forEach(file => {
                    // Check if file is image or video
                    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
                        console.warn('File type not supported:', file.type);
                        return; // Skip non-media files
                    }

                    // Max size constraint logic (300 MB)
                    if (file.size > 300 * 1024 * 1024) {
                        alert(`File ${file.name} is too large! Maximum size is 300MB.`);
                        return;
                    }

                    // Create a URL for the selected file
                    const fileURL = URL.createObjectURL(file);
                    
                    // Create the container element with fixed height constraints
                    const container = document.createElement('div');
                    container.className = 'media-card rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group h-48 md:h-56 animate-[fadeIn_0.5s_ease-out]';
                    
                    // Add a "New" badge
                    const badge = document.createElement('div');
                    badge.className = 'absolute top-2 left-2 z-10 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-sm';
                    badge.textContent = 'NEW';
                    container.appendChild(badge);

                    if (file.type.startsWith('image/')) {
                        // Handle Image Preview - uses object-contain so image is fully visible
                        container.classList.add('bg-slate-100');
                        
                        const img = document.createElement('img');
                        img.src = fileURL;
                        img.alt = file.name;
                        img.className = 'w-full h-full object-contain';
                        
                        const overlay = document.createElement('div');
                        overlay.className = 'absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center pointer-events-none';
                        overlay.innerHTML = '<span class="text-white opacity-0 group-hover:opacity-100 font-medium tracking-wide text-sm">Uploaded Image</span>';
                        
                        container.appendChild(img);
                        container.appendChild(overlay);
                        
                    } else if (file.type.startsWith('video/')) {
                        // Handle Video Preview - uses object-contain and black bg
                        container.classList.add('bg-black');
                        
                        const video = document.createElement('video');
                        video.src = fileURL;
                        video.controls = true;
                        video.className = 'w-full h-full object-contain';
                        
                        const typeBadge = document.createElement('div');
                        typeBadge.className = 'absolute top-2 right-2 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm z-10 pointer-events-none';
                        typeBadge.textContent = 'Video';
                        
                        container.appendChild(video);
                        container.appendChild(typeBadge);
                    }

                    // Add new item to the grid (at the beginning)
                    mediaGrid.insertBefore(container, mediaGrid.firstChild);
                    
                    // Update counter
                    totalItems++;
                    mediaCountSpan.textContent = `${totalItems} Items`;
                });
                
                // Reset input so the same files can be selected again if needed
                mediaInput.value = '';
            });
        });
    </script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</body>
</html>
